<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}The Lab{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen flex bg-white text-black antialiased">

  <!-- =========================
       SIDEBAR
       ========================= -->
  <aside class="w-60 min-h-screen flex flex-col bg-white border-r border-gray-200 px-4 py-6">

    <!-- Brand -->
    <div class="px-2 mb-10">
      <div class="flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-black"></span>
        <span class="text-base font-semibold tracking-tight">The Lab</span>
      </div>
    </div>

    <!-- Nav -->
    <nav class="flex flex-col gap-1 flex-1">

      <a href="{% url 'profile' %}"
         class="group flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium
                text-gray-600 hover:bg-gray-100 hover:text-black transition-colors">
        <svg class="w-5 h-5 text-gray-400 group-hover:text-black transition-colors"
             viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        Profile
      </a>

      <a href="{% url 'classes' %}"
         class="group flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium
                text-gray-600 hover:bg-gray-100 hover:text-black transition-colors">
        <svg class="w-5 h-5 text-gray-400 group-hover:text-black transition-colors"
             viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
          <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
        </svg>
        Lab Practical
      </a>

    </nav>

    <!-- Logout -->
    <form method="post" action="{% url 'logout' %}" class="pt-6 border-t border-gray-100">
      {% csrf_token %}
      <button type="submit"
              class="group w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium
                     text-gray-600 hover:bg-gray-100 hover:text-black transition-colors text-left">
        <svg class="w-5 h-5 text-gray-400 group-hover:text-black transition-colors"
             viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        Log out
      </button>
    </form>

  </aside>

  <!-- =========================
       PAGE CONTENT
       ========================= -->
  <main class="flex-1 bg-gray-50/40 min-h-screen p-10">
    {% block content %}{% endblock %}
  </main>

</body>
</html>
