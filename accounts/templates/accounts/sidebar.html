<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}The Lab{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen flex bg-gradient-to-br from-blue-50 via-pink-50 to-red-50 text-black antialiased">

  <style>
    /* Kid-friendly animations */
    @keyframes wiggle {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-6deg); }
      75% { transform: rotate(6deg); }
    }
    @keyframes bounce-soft {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-6px) rotate(2deg); }
    }
    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }
    @keyframes sparkle {
      0%, 100% { opacity: 0; transform: scale(0.5) rotate(0deg); }
      50% { opacity: 1; transform: scale(1) rotate(180deg); }
    }

    .nav-item:hover .nav-icon { animation: wiggle 0.5s ease-in-out infinite; }
    .nav-item:hover .nav-emoji { animation: pop 0.4s ease-in-out infinite; }
    .logo-badge { animation: float 3s ease-in-out infinite; }
    .nav-item:hover { animation: bounce-soft 0.6s ease-in-out infinite; }
    .sparkle { animation: sparkle 2s ease-in-out infinite; }
  </style>

  <!-- =========================
       SIDEBAR
       ========================= -->
  <aside class="w-64 min-h-screen flex flex-col bg-white border-r-4 border-blue-200 px-5 py-6 relative overflow-hidden">

    <!-- Decorative floating shapes -->
    <div class="absolute top-10 right-3 w-3 h-3 rounded-full bg-red-300 opacity-60 sparkle"></div>
    <div class="absolute top-40 left-4 w-2 h-2 rounded-full bg-blue-400 opacity-60 sparkle" style="animation-delay: 0.5s;"></div>
    <div class="absolute bottom-32 right-5 w-2.5 h-2.5 rounded-full bg-red-400 opacity-60 sparkle" style="animation-delay: 1s;"></div>
    <div class="absolute bottom-10 left-6 w-2 h-2 rounded-full bg-blue-300 opacity-60 sparkle" style="animation-delay: 1.5s;"></div>

    <!-- Brand -->
    <div class="px-2 mb-10 flex items-center gap-3">
      <div class="logo-badge w-12 h-12 rounded-2xl bg-gradient-to-br from-red-500 to-blue-600 flex items-center justify-center text-white text-2xl font-extrabold shadow-lg shadow-blue-300/60 border-2 border-white">
        🧪
      </div>
      <div>
        <div class="text-lg font-extrabold tracking-tight">
          <span class="text-red-500">The</span>
          <span class="text-blue-600">Lab</span>
        </div>
        <div class="text-[10px] font-bold text-gray-400 tracking-widest uppercase">Learn & Play</div>
      </div>
    </div>

    <!-- Nav -->
    <nav class="flex flex-col gap-3 flex-1 relative z-10">

      <!-- Profile -->
      <a href="{% url 'profile' %}"
         class="nav-item group flex items-center gap-3 px-3 py-3 rounded-2xl
                bg-blue-50 border-2 border-blue-200 hover:border-blue-400
                hover:bg-gradient-to-r hover:from-blue-100 hover:to-pink-100
                shadow-md hover:shadow-lg hover:shadow-blue-300/50
                transition-all duration-300">
        <div class="nav-icon w-10 h-10 rounded-xl bg-gradient-to-br from-blue-400 to-blue-600 flex items-center justify-center shadow-md">
          <svg class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </div>
        <div class="flex-1">
          <div class="text-sm font-extrabold text-blue-700">My Profile</div>
          <div class="text-[10px] font-semibold text-gray-400">Who am I? 🤔</div>
        </div>
        <span class="nav-emoji text-xl">👤</span>
      </a>

      <!-- Lab Practical -->
      <a href="{% url 'classes' %}"
         class="nav-item group flex items-center gap-3 px-3 py-3 rounded-2xl
                bg-red-50 border-2 border-red-200 hover:border-red-400
                hover:bg-gradient-to-r hover:from-red-100 hover:to-blue-100
                shadow-md hover:shadow-lg hover:shadow-red-300/50
                transition-all duration-300">
        <div class="nav-icon w-10 h-10 rounded-xl bg-gradient-to-br from-red-400 to-red-600 flex items-center justify-center shadow-md">
          <svg class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
          </svg>
        </div>
        <div class="flex-1">
          <div class="text-sm font-extrabold text-red-600">Lab Practical</div>
          <div class="text-[10px] font-semibold text-gray-400">Let's explore! 🚀</div>
        </div>
        <span class="nav-emoji text-xl">📚</span>
      </a>

    </nav>

    <!-- Fun fact sticker -->
    <div class="relative z-10 mb-4 p-3 rounded-2xl bg-gradient-to-br from-yellow-100 to-pink-100 border-2 border-dashed border-pink-300 text-center">
      <div class="text-2xl mb-1">⭐</div>
      <div class="text-[11px] font-bold text-gray-600 leading-tight">
        You're doing great!<br>Keep learning!
      </div>
    </div>

    <!-- Logout -->
    <form method="post" action="{% url 'logout' %}" class="pt-5 border-t-2 border-dashed border-gray-200 relative z-10">
      {% csrf_token %}
      <button type="submit"
              class="nav-item group w-full flex items-center gap-3 px-3 py-3 rounded-2xl
                     bg-gray-50 border-2 border-gray-200 hover:border-red-400
                     hover:bg-gradient-to-r hover:from-red-50 hover:to-red-100
                     shadow-sm hover:shadow-md hover:shadow-red-200/60
                     transition-all duration-300 text-left">
        <div class="nav-icon w-10 h-10 rounded-xl bg-gradient-to-br from-gray-400 to-gray-600 flex items-center justify-center shadow-md">
          <svg class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </div>
        <div class="flex-1">
          <div class="text-sm font-extrabold text-gray-600 group-hover:text-red-600">Log out</div>
          <div class="text-[10px] font-semibold text-gray-400">See you soon! 👋</div>
        </div>
      </button>
    </form>

  </aside>

  <!-- =========================
       PAGE CONTENT
       ========================= -->
  <main class="flex-1 min-h-screen p-10">
    {% block content %}{% endblock %}
  </main>

</body>
</html>
